# nginx: 2.petracker.pl → kontener PeTrace Alt na 127.0.0.1:8090.
# Plik kopiujesz do /etc/nginx/sites-available/2.petracker.pl (docs/DEPLOY.md, krok 6).
# Blok HTTPS (listen 443, certyfikat) dopisze sam certbot – nie dodawaj go ręcznie.

server {
    listen 80;
    listen [::]:80;
    server_name 2.petracker.pl;

    # Zdjęcia zwierząt są wysyłane do 3 MB (domyślny limit nginx to 1 MB).
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Prawdziwy adres IP użytkownika – potrzebny do limitów prób logowania (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
